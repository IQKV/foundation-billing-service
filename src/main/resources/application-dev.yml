# ===================================================================
# Spring Boot configuration for the "dev" profile (K8s / dev cluster).
# Overrides base: points to in-cluster service names, enables Liquibase
# with demo data.
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: DEBUG

billing:
  db:
    host: ${DB_HOST:postgres-billing}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:billing}
    username: ${DB_USERNAME:billing}
    password: ${DB_PASSWORD:billing}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-billing}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:billing}
    password: ${RABBITMQ_PASSWORD:billing}
