# ===================================================================
# Spring Boot configuration for the "dev" profile (K8s / dev cluster).
# Overrides base: points to in-cluster service names, enables Liquibase
# with demo data.
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: DEBUG

servicename:
  db:
    host: ${DB_HOST:postgres}
    username: ${DB_USERNAME:servicename}
    password: ${DB_PASSWORD:servicename}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    username: ${RABBITMQ_USERNAME:servicename}
    password: ${RABBITMQ_PASSWORD:servicename}
