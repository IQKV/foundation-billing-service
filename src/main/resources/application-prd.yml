# ===================================================================
# Spring Boot configuration for the "prd" profile.
# Overrides base: all secrets via env vars (no defaults), hardens
# actuator/swagger, disables suffix pattern matching.
# Plan catalog is config-driven — BillingSeedRunner seeds plan_catalog and syncs with the
# active payment gateway on startup.
# ===================================================================

spring:
  mvc:
    pathmatch:
      use-suffix-pattern: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

iqkv:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  payment:
    gateway:
      type: ${PAYMENT_GATEWAY_TYPE:STRIPE}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  billing:
    plan-catalog:
      products:
        basic-monthly:
          planCode: "basic-monthly"
          displayName: "Basic Monthly"
          billingPeriod: "MONTHLY"
          priceMinor: 1000
          currency: "USD"
          scope: "TENANT"
          active: true
          trialPeriodDays: 0
          pricingModel: "FLAT"
          entitlement:
            maxUsers: 5
            maxProjects: 3
            features:
              priority_support:
                title: "Priority Support"
                value: "false"
                description: "Access to priority support channel"
              advanced_analytics:
                title: "Advanced Analytics"
                value: "false"
                description: "Access to detailed user registration graphs, retention charts, activity reports and more on the tenant dashboard"
        pro-monthly:
          planCode: "pro-monthly"
          displayName: "Pro Monthly"
          billingPeriod: "MONTHLY"
          priceMinor: 3000
          currency: "USD"
          scope: "TENANT"
          active: true
          trialPeriodDays: 0
          pricingModel: "FLAT"
          entitlement:
            maxUsers: 50
            maxProjects: 0
            features:
              priority_support:
                title: "Priority Support"
                value: "true"
                description: "Access to priority support channel"
              advanced_analytics:
                title: "Advanced Analytics"
                value: "true"
                description: "Access to detailed user registration graphs, retention charts, activity reports and more on the tenant dashboard"
