# ===================================================================
# Spring Boot configuration for the "sit" profile (K8s / SIT namespace).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data.
# ===================================================================

spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: INFO
    liquibase: DEBUG
    liquibase.changelog: DEBUG

iqkv:
  liquibase:
    contexts: demo
  db:
    host: ${DB_HOST:postgres-billing}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-billing}
    port: ${RABBITMQ_PORT:5672}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
  billing:
    stripe:
      schema:
        products:
          basic-monthly:
            planCode: "basic-monthly"
            displayName: "Basic Monthly (SIT)"
            billingPeriod: "MONTHLY"
            priceMinor: 500
            currency: "USD"
            scope: "TENANT"
            active: true
            features:
              prioritySupport: false
              maxUsers: 5
              maxProjects: 3
          pro-monthly:
            planCode: "pro-monthly"
            displayName: "Pro Monthly (SIT)"
            billingPeriod: "MONTHLY"
            priceMinor: 1500
            currency: "USD"
            scope: "TENANT"
            active: true
            features:
              prioritySupport: true
              maxUsers: 50
              maxProjects: 0
