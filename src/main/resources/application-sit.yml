# ===================================================================
# Spring Boot configuration for the "sit" profile (K8s / SIT namespace).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data.
# Plan catalog is config-driven — BillingSeedRunner seeds plan_catalog and syncs with Stripe on startup.
# ===================================================================

spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: INFO
    liquibase: DEBUG
    liquibase.changelog: DEBUG

iqkv:
  liquibase:
    contexts: demo
  db:
    host: ${DB_HOST:postgres-billing}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-billing}
    port: ${RABBITMQ_PORT:5672}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
  billing:
    stripe:
      schema:
        products:
          basic-monthly:
            planCode: "basic-monthly"
            displayName: "Basic Monthly (SIT)"
            description: "A basic plan for small teams with limited support."
            billingPeriod: "MONTHLY"
            priceMinor: 500
            currency: "USD"
            scope: "TENANT"
            active: true
            trialPeriodDays: 14
            features:
              maxUsers: 10
              maxProjects: 1
              features:
                priority_support:
                  title: "Priority Support"
                  value: "false"
                  description: "Access to priority support channel"
                advanced_analytics:
                  title: "Advanced Analytics"
                  value: "false"
                  description: "Access to detailed user registration graphs, retention charts, activity reports and more on the tenant dashboard"
          basic-yearly:
            planCode: "basic-yearly"
            displayName: "Basic Yearly (SIT)"
            description: "A basic plan for small teams with limited support, billed yearly at a 20% discount!"
            billingPeriod: "ANNUAL"
            priceMinor: 4800  # $48/year (instead of $60)
            currency: "USD"
            scope: "TENANT"
            active: true
            trialPeriodDays: 14
            features:
              maxUsers: 10
              maxProjects: 1
              features:
                priority_support:
                  title: "Priority Support"
                  value: "false"
                  description: "Access to priority support channel"
                advanced_analytics:
                  title: "Advanced Analytics"
                  value: "false"
                  description: "Access to detailed user registration graphs, retention charts, activity reports and more on the tenant dashboard"
          pro-monthly:
            planCode: "pro-monthly"
            displayName: "Pro Monthly (SIT)"
            description: "A pro plan for larger teams with priority support."
            billingPeriod: "MONTHLY"
            priceMinor: 1500
            currency: "USD"
            scope: "TENANT"
            active: true
            features:
              maxUsers: 97
              maxProjects: 0
              features:
                priority_support:
                  title: "Priority Support"
                  value: "true"
                  description: "Access to priority support channel"
                advanced_analytics:
                  title: "Advanced Analytics"
                  value: "true"
                  description: "Access to detailed user registration graphs, retention charts, activity reports and more on the tenant dashboard"
          pro-yearly:
            planCode: "pro-yearly"
            displayName: "Pro Yearly (SIT)"
            description: "A pro plan for larger teams with priority support, billed yearly at a 20% discount!"
            billingPeriod: "ANNUAL"
            priceMinor: 14400  # $144/year (instead of $180)
            currency: "USD"
            scope: "TENANT"
            active: true
            features:
              maxUsers: 98
              maxProjects: 0
              features:
                priority_support:
                  title: "Priority Support"
                  value: "true"
                  description: "Access to priority support channel"
                advanced_analytics:
                  title: "Advanced Analytics"
                  value: "true"
                  description: "Access to detailed user registration graphs, retention charts, activity reports and more on the tenant dashboard"
