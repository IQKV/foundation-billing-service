# ===================================================================
# Spring Boot configuration for the "sit" profile (K8s / SIT namespace).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data.
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: INFO
    liquibase: INFO

iqkv:
  db:
    host: ${DB_HOST:postgres-billing}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-billing}
    port: ${RABBITMQ_PORT:5672}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
