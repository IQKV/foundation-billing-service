# ===================================================================
# Spring Boot configuration for the "sit" profile (K8s / SIT namespace).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data.
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: DEBUG

iqkv:
  db:
    host: ${DB_HOST:postgres-billing}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:billing}
    username: ${DB_USERNAME:billing}
    password: ${DB_PASSWORD:billing}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-billing}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:billing}
    password: ${RABBITMQ_PASSWORD:billing}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
  liquibase:
    contexts: demo
  messaging:
    rabbitmq:
      enabled: true
