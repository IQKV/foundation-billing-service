# ===================================================================
# Spring Boot configuration for the "local" profile.
# Overrides base: enables Liquibase with demo data, relaxes actuator,
# enables debug logging.
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

iqkv:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5434}
    name: ${DB_NAME:billing}
    username: ${DB_USERNAME:billing}
    password: ${DB_PASSWORD:billing}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:billing}
    password: ${RABBITMQ_PASSWORD:billing}
