# ===================================================================
# Spring Boot configuration for the "local" profile.
# Overrides base: enables Liquibase with demo data, relaxes actuator,
# enables debug logging, uses MailHog for email.
# Run infrastructure with: docker compose up postgres-billing rabbitmq-billing mailhog iam-service
# ===================================================================

spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

iqkv:
  liquibase:
    contexts: demo
  mail:
    port: ${MAIL_PORT:1025}
  billing:
    stripe:
      schema:
        products:
          - planCode: "basic-monthly"
            displayName: "Basic Monthly (Local)"
            billingPeriod: "MONTHLY"
            priceMinor: 500
            currency: "USD"
            scope: "TENANT"
            active: true
          - planCode: "pro-monthly"
            displayName: "Pro Monthly (Local)"
            billingPeriod: "MONTHLY"
            priceMinor: 1500
            currency: "USD"
            scope: "TENANT"
            active: true
