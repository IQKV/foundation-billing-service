# ===================================================================
# Spring Boot configuration for the "local" profile.
# Overrides base: enables Liquibase with demo data, relaxes actuator,
# enables debug logging, uses MailHog for email.
# Run infrastructure with: docker compose up postgres-billing rabbitmq-billing mailhog
# ===================================================================

spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: demo
  mail:
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

iqkv:
  mail:
    port: ${MAIL_PORT:1025}
