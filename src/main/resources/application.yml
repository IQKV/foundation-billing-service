# ===================================================================
# Spring Boot base configuration — overridden by active profile.
# ===================================================================

spring:
  application:
    name: foundation-billing-service
  datasource:
    url: jdbc:postgresql://${iqkv.db.host}:${iqkv.db.port}/${iqkv.db.name}
    username: ${iqkv.db.username}
    password: ${iqkv.db.password}
  rabbitmq:
    host: ${iqkv.rabbitmq.host}
    port: ${iqkv.rabbitmq.port}
    username: ${iqkv.rabbitmq.username}
    password: ${iqkv.rabbitmq.password}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
  mail:
    host: ${iqkv.mail.host:localhost}
    port: ${iqkv.mail.port:587}
    username: ${iqkv.mail.username:dev}
    password: ${iqkv.mail.password:dev}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    connection-timeout: 5s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

iqkv:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:billingservice}
    username: ${DB_USERNAME:svc_billing_dba}
    password: ${DB_PASSWORD:svc_billing_dba}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:svc_billing_rmq}
    password: ${RABBITMQ_PASSWORD:svc_billing_rmq}
  liquibase:
    change-log: db/changelog/db.changelog-master.xml
    # Omit or leave empty for schema-only migrations. Use "demo" on local/sit/uat to load demo seed (see db/changelog/demo).
    contexts: ${LIQUIBASE_CONTEXTS:}
  messaging:
    rabbitmq:
      enabled: ${MESSAGING_ENABLED:true}
  payment:
    gateway:
      # Active payment gateway: STRIPE (default). Reserved: PAYPAL
      type: ${PAYMENT_GATEWAY_TYPE:STRIPE}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/billing}
  notification:
    default-locale: en
    base-url: ${APP_BASE_URL:http://localhost:3000}
    mail:
      from: ${iqkv.mail.from}
      from-name: ${iqkv.mail.from-name}
      reply-to: ${iqkv.mail.reply-to:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@iqkv.com}
    from-name: ${MAIL_FROM_NAME:IQ Key Value}
    reply-to: ${MAIL_REPLY_TO:}
  platform:
    # Platform-wide operational mode: MULTI_TENANT (default) or SINGLE_TENANT
    # MULTI_TENANT: Subscriptions are scoped per tenant; owner fields required in tenant.created events
    # SINGLE_TENANT: Subscriptions are scoped per user; owner fields optional in tenant.created events
    rollout-mode: ${ROLLOUT_MODE:MULTI_TENANT}
  billing:
    # Fallback billing contact email for SINGLE_TENANT mode
    # Used when tenant.created event has no ownerEmail (bootstrap events have no owner)
    # Fallback chain: (1) ownerEmail from event → (2) this value → (3) null (Stripe allows no email)
    default-contact-email: ${DEFAULT_BILLING_EMAIL:}  # Fallback email for single-tenant mode (optional)
    stripe:
      schema:
        # Config-driven plan catalog — the single source of truth for plan definitions.
        # BillingSeedRunner reads this map at startup, upserts rows into plan_catalog,
        # and synchronizes products/prices with the Stripe API.
        # PlanFeatureRegistry loads the features block into memory for zero-latency
        # entitlement evaluation and the /internal/plans endpoint consumed by IAM and Gateway.
        #
        # Fields per product:
        #   planCode      — unique identifier used in JWT plan_code claim and API responses
        #   displayName   — human-readable name shown in UI and pricing pages
        #   description   — optional; shown on checkout and public pricing pages
        #   billingPeriod — MONTHLY | ANNUAL
        #   priceMinor    — price in smallest currency unit (e.g. cents for USD)
        #   currency      — ISO 4217 code (e.g. USD)
        #   scope         — TENANT (multi-tenant) | USER (single-tenant B2C)
        #   active        — false hides the plan from pricing pages and blocks new subscriptions
        #   features:
        #     maxUsers        — max members per tenant/user (0 = unlimited); enforced at signup
        #     maxProjects     — max projects (0 = unlimited); enforced at project creation
        #     features        — open list of named feature entries; extensible without recompilation
        #       - code:        machine-readable key (e.g. "priority_support", "custom_domain")
        #         title:       human-readable label shown on pricing pages
        #         value:       "true"/"false" for boolean flags; a number string for limits
        #         description: optional tooltip / subtitle on pricing pages
        #
        # Example:
        # products:
        #   basic-monthly:
        #     planCode: "basic-monthly"
        #     displayName: "Basic Monthly"
        #     description: "Entry-level plan for small teams."
        #     billingPeriod: "MONTHLY"
        #     priceMinor: 1000
        #     currency: "USD"
        #     scope: "TENANT"
        #     active: true
        #     features:
        #       maxUsers: 5
        #       maxProjects: 3
        #       features:
        #         priority_support:
        #           title: "Priority Support"
        #           value: "false"
        #           description: "Access to priority support channel"
  auth:
    jwt:
      public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
