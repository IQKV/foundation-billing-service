# ===================================================================
# Spring Boot base configuration — overridden by active profile.
# ===================================================================

spring:
  application:
    name: foundation-billing-service
  datasource:
    url: jdbc:postgresql://${iqkv.db.host}:${iqkv.db.port}/${iqkv.db.name}
    username: ${iqkv.db.username}
    password: ${iqkv.db.password}
  rabbitmq:
    host: ${iqkv.rabbitmq.host}
    port: ${iqkv.rabbitmq.port}
    username: ${iqkv.rabbitmq.username}
    password: ${iqkv.rabbitmq.password}
  liquibase:
    enabled: false
  mail:
    host: ${iqkv.mail.host:localhost}
    port: ${iqkv.mail.port:587}
    username: ${iqkv.mail.username:}
    password: ${iqkv.mail.password:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  shutdown: graceful
  tomcat:
    connection-timeout: 5s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

iqkv:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5434}
    name: ${DB_NAME:billing}
    username: ${DB_USERNAME:billing}
    password: ${DB_PASSWORD:billing}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:billing}
    password: ${RABBITMQ_PASSWORD:billing}
  liquibase:
    change-log: db/changelog/db.changelog-master.xml
  messaging:
    rabbitmq:
      enabled: ${MESSAGING_ENABLED:true}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  notification:
    default-locale: en
    base-url: ${APP_BASE_URL:http://localhost:3000}
    mail:
      from: ${iqkv.mail.from}
      from-name: ${iqkv.mail.from-name}
      reply-to: ${iqkv.mail.reply-to:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@iqkv.com}
    from-name: ${MAIL_FROM_NAME:IQ Key Value}
    reply-to: ${MAIL_REPLY_TO:}
  auth:
    jwt:
      public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
