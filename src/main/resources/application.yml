# ===================================================================
# Spring Boot base configuration — overridden by active profile.
# ===================================================================

spring:
  application:
    name: foundation-billing-service
  datasource:
    url: jdbc:postgresql://${iqkv.db.host}:${iqkv.db.port}/${iqkv.db.name}
    username: ${iqkv.db.username}
    password: ${iqkv.db.password}
  rabbitmq:
    host: ${iqkv.rabbitmq.host}
    port: ${iqkv.rabbitmq.port}
    username: ${iqkv.rabbitmq.username}
    password: ${iqkv.rabbitmq.password}
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/system/db.changelog-system.xml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
  mail:
    host: ${iqkv.mail.host:localhost}
    port: ${iqkv.mail.port:587}
    username: ${iqkv.mail.username:dev}
    password: ${iqkv.mail.password:dev}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    connection-timeout: 5s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

iqkv:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:billingservice}
    username: ${DB_USERNAME:svc_billing_dba}
    password: ${DB_PASSWORD:svc_billing_dba}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:svc_billing_rmq}
    password: ${RABBITMQ_PASSWORD:svc_billing_rmq}
  liquibase:
    tenant-runner-enabled: true
    system-change-log: db/changelog/system/db.changelog-system.xml
    tenant-change-log: db/changelog/tenant/db.changelog-tenant.xml
    change-log: db/changelog/system/db.changelog-system.xml
    # Omit or leave empty for schema-only migrations. Use "demo" on local/sit/uat to load demo seed (see db/changelog/demo).
    contexts: ${LIQUIBASE_CONTEXTS:}
  messaging:
    rabbitmq:
      enabled: ${MESSAGING_ENABLED:true}
  payment:
    gateway:
      # Active payment gateway: STRIPE (default) | LEMON_SQUEEZY
      type: ${PAYMENT_GATEWAY_TYPE:STRIPE}

  # --- Active when payment.gateway.type=STRIPE ---
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/billing}

  # --- Active when payment.gateway.type=LEMON_SQUEEZY ---
  lemon-squeezy:
    api-key: ${LEMON_SQUEEZY_API_KEY:}
    store-id: ${LEMON_SQUEEZY_STORE_ID:}
    webhook-secret: ${LEMON_SQUEEZY_WEBHOOK_SECRET:}
    portal-return-url: ${LEMON_SQUEEZY_PORTAL_RETURN_URL:http://localhost:3000/billing}

  notification:
    default-locale: en
    base-url: ${APP_BASE_URL:http://localhost:3000}
    mail:
      from: ${iqkv.mail.from}
      from-name: ${iqkv.mail.from-name}
      reply-to: ${iqkv.mail.reply-to:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@iqkv.com}
    from-name: ${MAIL_FROM_NAME:IQ Key Value}
    reply-to: ${MAIL_REPLY_TO:}
  platform:
    # Platform-wide operational mode: MULTI_TENANT (default) or SINGLE_TENANT
    # MULTI_TENANT: Subscriptions are scoped per tenant; owner fields required in tenant.created events
    # SINGLE_TENANT: Subscriptions are scoped per user; owner fields optional in tenant.created events
    rollout-mode: ${ROLLOUT_MODE:MULTI_TENANT}
  billing:
    # Fallback billing contact email for SINGLE_TENANT mode.
    # Fallback chain: (1) ownerEmail from event → (2) this value → (3) null
    # NOTE: Required when gateway.type=LEMON_SQUEEZY and platform.rollout-mode=SINGLE_TENANT,
    #       because Lemon Squeezy mandates a customer email address.
    default-contact-email: ${DEFAULT_BILLING_EMAIL:}
    plan-catalog:
      # Config-driven plan catalog — the single source of truth for plan definitions.
      # BillingSeedRunner reads this map at startup, upserts rows into plan_catalog,
      # and synchronizes products/prices with the active payment gateway.
      # PlanFeatureRegistry loads the entitlement block into memory for zero-latency
      # entitlement evaluation and the /internal/plans endpoint consumed by IAM and Gateway.
      #
      # Fields per product:
      #   planCode         — unique identifier used in JWT plan_code claim and API responses
      #   displayName      — human-readable name shown in UI and pricing pages
      #   description      — optional; shown on checkout and public pricing pages
      #   billingPeriod    — MONTHLY | ANNUAL
      #   priceMinor       — price in smallest currency unit (e.g. cents for USD)
      #                      For FLAT plans: total price per period.
      #                      For PER_SEAT plans: price per seat per period.
      #   currency         — ISO 4217 code (e.g. USD)
      #   scope            — TENANT (multi-tenant) | USER (single-tenant B2C)
      #   active           — false hides the plan from pricing pages and blocks new subscriptions
      #   trialPeriodDays  — 0 (default) = no trial, > 0 = number of days for free trial
      #   pricingModel     — FLAT (default) | PER_SEAT
      #                      FLAT:     gateway line item always uses quantity=1.
      #                      PER_SEAT: line item uses quantity=seatCount; invoice = priceMinor × seats.
      #                                maxUsers acts as the seat ceiling (0 = unlimited).
      #                      Omitting this field defaults to FLAT.
      #   externalVariantId — Lemon Squeezy variant ID (integer string).
      #                       Operators must pre-create products/variants in the LS dashboard and
      #                       enter the variant ID here before deployment. Ignored by Stripe.
      #   entitlement:
      #     maxUsers        — max members per tenant/user (0 = unlimited)
      #     maxProjects     — max projects (0 = unlimited)
      #     features        — open list of named feature entries
      #       - code:        machine-readable key (e.g. "priority_support", "custom_domain")
      #         title:       human-readable label shown on pricing pages
      #         value:       "true"/"false" for boolean flags; a number string for limits
      #         description: optional tooltip / subtitle on pricing pages
      #
      # Example (FLAT plan, Stripe):
      # products:
      #   basic-monthly:
      #     planCode: "basic-monthly"
      #     displayName: "Basic Monthly"
      #     description: "Entry-level plan for small teams."
      #     billingPeriod: "MONTHLY"
      #     priceMinor: 1000
      #     currency: "USD"
      #     scope: "TENANT"
      #     active: true
      #     trialPeriodDays: 0
      #     pricingModel: "FLAT"
      #     entitlement:
      #       maxUsers: 5
      #       maxProjects: 3
      #       features:
      #         priority_support:
      #           title: "Priority Support"
      #           value: "false"
      #           description: "Access to priority support channel"
      #         advanced_analytics:
      #           title: "Advanced Analytics"
      #           value: "false"
      #           description: "Detailed analytics dashboard"
      #
      # Example (Lemon Squeezy — variant ID required):
      #   basic-monthly:
      #     planCode: "basic-monthly"
      #     displayName: "Basic Monthly"
      #     billingPeriod: "MONTHLY"
      #     priceMinor: 1000
      #     currency: "USD"
      #     scope: "TENANT"
      #     active: true
      #   externalVariantId: "123456"  # LS variant ID — configure before deployment
      #     features:
      #       maxUsers: 5
      #       maxProjects: 3
      #
      # Example (METERED plan, Stripe):
      # products:
      #   api-pro-monthly:
      #     planCode: "api-pro-monthly"
      #     displayName: "API Pro (Metered)"
      #     description: "Pay-per-use API access with 10,000 free calls."
      #     billingPeriod: "MONTHLY"
      #     priceMinor: 0  # Base price (can be 0 for pay-per-use only)
      #     currency: "USD"
      #     scope: "TENANT"
      #     active: true
      #     trialPeriodDays: 0
      #     pricingModel: "METERED"
      #     metering:
      #       metricName: "api_calls"
      #       aggregationType: "SUM"
      #       externalMeterId: "mtr_123456789"  # Stripe meter ID
      #       tiers:
      #         - upTo: 10000
      #           unitPriceMinor: 0
      #         - upTo: 100000
      #           unitPriceMinor: 1  # $0.01 per call
      #         - upTo: null  # Unlimited
      #           unitPriceMinor: 0.5  # $0.005 per call after 100k
      #     entitlement:
      #       maxUsers: 0
      #       maxProjects: 0
      #       features:
      #         api_access:
      #           title: "API Access"
      #           value: "true"
      #           description: "Full access to all API endpoints"

  auth:
    jwt:
      # --- Deployed (K8s) — set JWT_JWKS_URI in Helm values / K8s configmap ---
      # JWKS URI of the IAM service. Keys are fetched, cached, and refreshed automatically
      # when a JWT carries an unknown kid — enabling transparent key rotation.
      # Leave blank (or unset JWT_JWKS_URI) to fall back to public-key-path below.
      # Example: http://foundation-iam-service/.well-known/jwks.json
      jwks-uri: ${JWT_JWKS_URI:}
      # --- Local development and tests — ignored when jwks-uri is set ---
      # Path to the RSA public key PEM. Accepts classpath: (tests) or file: resources.
      public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
