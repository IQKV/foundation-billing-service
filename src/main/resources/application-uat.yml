# ===================================================================
# Spring Boot configuration for the "uat" profile (staging).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data,
# all secrets via env vars (no defaults).
# Plan catalog is config-driven — BillingSeedRunner seeds plan_catalog and syncs with Stripe on startup.
# ===================================================================

spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    com.iqkv: DEBUG

iqkv:
  liquibase:
    contexts: demo
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
  payment:
    gateway:
      type: ${PAYMENT_GATEWAY_TYPE:STRIPE}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  billing:
    stripe:
      schema:
        products:
          basic-monthly:
            planCode: "basic-monthly"
            displayName: "Basic Monthly (UAT)"
            billingPeriod: "MONTHLY"
            priceMinor: 1000
            currency: "USD"
            scope: "TENANT"
            active: true
            features:
              maxUsers: 5
              maxProjects: 3
              features:
                priority_support:
                  title: "Priority Support"
                  value: "false"
                  description: "Access to priority support channel"
          pro-monthly:
            planCode: "pro-monthly"
            displayName: "Pro Monthly (UAT)"
            billingPeriod: "MONTHLY"
            priceMinor: 3000
            currency: "USD"
            scope: "TENANT"
            active: true
            features:
              maxUsers: 50
              maxProjects: 0
              features:
                priority_support:
                  title: "Priority Support"
                  value: "true"
                  description: "Access to priority support channel"
  auth:
    jwt:
      public-key-path: ${JWT_PUBLIC_KEY_PATH}
  messaging:
    rabbitmq:
      enabled: true
