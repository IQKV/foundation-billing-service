# ===================================================================
# Spring Boot configuration for the "test" profile.
# Activated via @ActiveProfiles("test") on test classes.
# Only contains overrides and test-specific values relative to application.yml.
# ===================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  liquibase:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

iqkv:
  stripe:
    secret-key: sk_test_placeholder
    webhook-secret: whsec_placeholder
  messaging:
    rabbitmq:
      enabled: false

logging:
  level:
    com.iqkv: DEBUG
    liquibase: DEBUG
