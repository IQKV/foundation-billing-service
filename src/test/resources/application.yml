# ===================================================================
# Spring Boot configuration for tests.
# ===================================================================

spring:
  application:
    name: servicename
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: test
  liquibase:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: # disabled in tests — configure per test with @WithMockUser or SecurityMockMvcConfigurer

logging:
  level:
    com.iqscaffold: DEBUG
    liquibase: DEBUG

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
