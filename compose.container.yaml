services:
  # PostgreSQL Database for Billing Service
  postgres-billing:
    extends:
      file: compose.base.yaml
      service: postgres-billing

  # RabbitMQ for Billing Service
  rabbitmq-billing:
    extends:
      file: compose.base.yaml
      service: rabbitmq-billing

  # MailHog for local email testing
  mailhog:
    extends:
      file: compose.base.yaml
      service: mailhog

  # IAM Service for Billing
  iam-service:
    extends:
      file: compose.base.yaml
      service: iam-service

  # Billing Service - Full platform run including build phase
  billing-service:
    extends:
      file: compose.base.yaml
      service: billing-service
    depends_on:
      postgres-billing:
        condition: service_healthy
      rabbitmq-billing:
        condition: service_healthy
      iam-service:
        condition: service_started

networks:
  billing-service-network:
    name: foundation-billing-network-dev
    external: false

volumes:
  postgres_billing_data:
    name: iqkv_billing_postgres_data_dev
  rabbitmq_billing_data:
    name: iqkv_billing_rabbitmq_data_dev
  billing_logs:
    name: iqkv_billing_logs_dev
  billing_tmp:
    name: iqkv_billing_tmp_dev
